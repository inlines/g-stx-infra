services:
  igdb-metrics:
    image: prom/node-exporter:v1.11.1
    restart: unless-stopped
    command:
      - '--collector.disable-defaults'
      - '--collector.textfile'
      - '--collector.textfile.directory=/metrics'
      - '--web.disable-exporter-metrics'
    volumes:
      - "/var/lib/game-stockx-igdb/metrics:/metrics:ro"
    networks:
      - frontend-backend

  backend:
    restart: unless-stopped
    build:
      context: ./backend
    networks:
      - frontend-backend
    environment:
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/gstx
      - REDIS_URL=redis://default:${REDIS_PASSWORD}@redis:6379
      - RUST_LOG=${RUST_LOG}
      - TRUST_PROXY_HEADERS=true
    expose:
      - "9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:  # Добавлен healthcheck для backend
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    restart: unless-stopped
    image: redis:alpine
    command: [
      "redis-server",
      "--requirepass ${REDIS_PASSWORD}",
      "--bind 0.0.0.0",
      "--maxmemory 256mb",  # Лимит памяти
      "--maxmemory-policy allkeys-lru",
      "--save", "",  # Rebuildable cache: no snapshots on tmpfs.
      "--appendonly", "no"
    ]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - frontend-backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
    ports:
      - "80:80"
    networks:
      - frontend-backend
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - /var/www/static:/var/www/static:ro

  postgres:
    restart: unless-stopped
    stop_grace_period: 60s
    image: postgres:15
    environment:
      POSTGRES_DB: gstx
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - frontend-backend
    # Использование "healthcheck" для проверки готовности базы данных
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s

  prometheus:
    image: prom/prometheus
    restart: unless-stopped
    container_name: prometheus
    # Заменяем проброс порта на внутренний экспорт:
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/web.yml:/etc/prometheus/web.yml
      - prometheus-data:/prometheus
    environment:
      - BASIC_AUTH_PASSWORD=${PROMETHEUS_PASSWORD}
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.config.file=/etc/prometheus/web.yml'
      - '--web.listen-address=:9090'
      - '--storage.tsdb.path=/prometheus/data'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-90d}'
      - '--storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-2GB}'
    networks:
      - frontend-backend

  postgres-metrics:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.18.1
    profiles: ["db-monitoring"]
    restart: unless-stopped
    command:
      - '--collector.stat_statements'
      - '--no-collector.stat_statements.include_query'
      - '--collector.postmaster'
    environment:
      DATA_SOURCE_URI: "postgres:5432/gstx?sslmode=disable&connect_timeout=5&application_name=gstx_metrics"
      DATA_SOURCE_USER: gstx_monitor
      DATA_SOURCE_PASS_FILE: /run/secrets/pg-monitor-password
    volumes:
      - ./.secrets/pg-monitor-password:/run/secrets/pg-monitor-password:ro
    networks:
      - frontend-backend

  redis-metrics:
    image: oliver006/redis_exporter:v1.88.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - frontend-backend

  grafana:
    restart: unless-stopped
    env_file:
      - ./.secrets/monitoring.env
    image: grafana/grafana
    container_name: grafana
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      - PROMETHEUS_PASSWORD=${PROMETHEUS_PASSWORD}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAPHANA_PASSWORD}
      - GF_AUTH_PROXY_ENABLED=true
      - GF_AUTH_PROXY_HEADER_NAME=X-WEBAUTH-USER
      - GF_AUTH_PROXY_HEADER_PROPERTY=username
      - GF_AUTH_PROXY_AUTO_SIGN_UP=true
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - frontend-backend


volumes:
  redis_data:
      driver: local
      driver_opts:
        type: tmpfs
        device: tmpfs
  pgdata:
  grafana-storage:
  prometheus-data:
    external: true
    name: g-stx-infra_prometheus-data

networks:
  frontend-backend:
    driver: bridge
