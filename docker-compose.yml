services:
  igdb-metrics:
    image: prom/node-exporter:v1.11.1
    restart: unless-stopped
    command:
      - '--collector.disable-defaults'
      - '--collector.textfile'
      - '--collector.textfile.directory=/metrics'
      - '--web.disable-exporter-metrics'
    volumes:
      - "/var/lib/game-stockx-igdb/metrics:/metrics:ro"
    networks:
      - frontend-backend

  backend:
    build:
      context: ./backend
    networks:
      - frontend-backend
    environment:
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/gstx
      - REDIS_URL=redis://default:${REDIS_PASSWORD}@redis:6379
      - RUST_LOG=${RUST_LOG}
    ports:
      - "9090"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:  # Добавлен healthcheck для backend
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:alpine
    command: [
      "redis-server",
      "--requirepass ${REDIS_PASSWORD}",
      "--bind 0.0.0.0",
      "--maxmemory 256mb",  # Лимит памяти
      "--maxmemory-policy allkeys-lru",
      "--save", "",  # Rebuildable cache: no snapshots on tmpfs.
      "--appendonly", "no"
    ]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - frontend-backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    networks:
      - frontend-backend
    depends_on:
      - backend
    volumes:
      - /var/www/static:/var/www/static:ro

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: gstx
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - frontend-backend
    # Использование "healthcheck" для проверки готовности базы данных
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    # Заменяем проброс порта на внутренний экспорт:
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/web.yml:/etc/prometheus/web.yml
    environment:
      - BASIC_AUTH_PASSWORD=${PROMETHEUS_PASSWORD}
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.config.file=/etc/prometheus/web.yml'
      - '--web.listen-address=:9090'
    networks:
      - frontend-backend

  redis-metrics:
    image: oliver006/redis_exporter:v1.88.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - frontend-backend

  grafana:
    image: grafana/grafana
    container_name: grafana
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      - PROMETHEUS_PASSWORD=${PROMETHEUS_PASSWORD}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAPHANA_PASSWORD}
      - GF_AUTH_PROXY_ENABLED=true
      - GF_AUTH_PROXY_HEADER_NAME=X-WEBAUTH-USER
      - GF_AUTH_PROXY_HEADER_PROPERTY=username
      - GF_AUTH_PROXY_AUTO_SIGN_UP=true
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - frontend-backend


volumes:
  redis_data:
      driver: local
      driver_opts:
        type: tmpfs
        device: tmpfs
  pgdata:
  grafana-storage:

networks:
  frontend-backend:
    driver: bridge
