server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The HTML shell must refresh after a deployment; hashed assets are immutable by name.
    location = /index.html { expires -1; }
    location ~* "^/(?:[^/]+-[a-z0-9_-]{8,}\.(?:js|css)|media/[^/]+-[a-z0-9_-]{8,}\.(?:woff2?|otf|ttf))$" {
        try_files $uri =404;
        expires 1y;
    }


    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Report-only first: keep existing Angular styles, images and chat working.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src * data: blob:; media-src 'self' blob:; connect-src 'self' ws: wss:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /static/ {
        root /var/www;
        try_files $uri $uri/ =404;

        # Оптимизация статики
        expires 1h;
        access_log off;
    }

    location ^~ /api/ {
        proxy_pass http://backend:9090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /ws/ {
        proxy_pass http://backend:9090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\n";
    }

    # Защита скрытых файлов
    location ~ /\. {
        deny all;
        return 404;
    }
}
