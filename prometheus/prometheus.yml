global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'igdb-sync'
    static_configs:
      - targets: ['igdb-metrics:9100']
  - job_name: 'backend'
    static_configs:
      - targets: ['backend:9090']
    basic_auth:
      username: admin
      password: ${PROMETHEUS_PASSWORD}
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-metrics:9121']
